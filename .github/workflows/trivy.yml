name: Trivy Security Scan

on:
  schedule:
    # Run at 00:00 on day 1 of every 3rd month (January, April, July, October)
    - cron: "0 0 1 */3 *"
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write # For uploading results to GitHub Security tab

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH"

      - name: Convert repository scan to SARIF
        run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: "trivy-results.sarif"

      - name: Report and gate repository vulnerabilities
        if: always() && hashFiles('trivy-results.json') != ''
        run: trivy convert --format table --severity CRITICAL,HIGH --exit-code 1 trivy-results.json

  trivy-docker:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t jira-action:latest .

      - name: Run Trivy vulnerability scanner on Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "jira-action:latest"
          format: "json"
          output: "trivy-docker-results.json"
          severity: "CRITICAL,HIGH"

      - name: Convert image scan to SARIF
        run: trivy convert --format sarif --output trivy-docker-results.sarif trivy-docker-results.json

      - name: Upload Trivy Docker results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-docker-results.sarif') != ''
        with:
          sarif_file: "trivy-docker-results.sarif"

      # Gated at CRITICAL only: the base image still carries Go stdlib HIGHs that
      # can only be cleared by an upstream go-jira rebuild. They remain visible
      # in the Security tab via the SARIF upload above.
      - name: Report and gate image vulnerabilities
        if: always() && hashFiles('trivy-docker-results.json') != ''
        run: trivy convert --format table --severity CRITICAL --exit-code 1 trivy-docker-results.json
